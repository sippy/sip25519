name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip xml2rfc

      - name: Build generated draft files
        run: make clean all XML2RFC=xml2rfc

      - name: Commit generated files on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md RFC/draft-sip-digest-auth-X25519-Ristretto255-Schnorr.txt
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate draft outputs"
            git push
          fi

      - name: Check generated files are current
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        run: |
          git diff --exit-code -- README.md RFC/draft-sip-digest-auth-X25519-Ristretto255-Schnorr.txt
          test -z "$(git status --porcelain -- README.md RFC/draft-sip-digest-auth-X25519-Ristretto255-Schnorr.txt)"

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-draft
          path: |
            README.md
            RFC/draft-sip-digest-auth-X25519-Ristretto255-Schnorr.txt
